.week-first .day:has(input:checked) { background: var(--accent); color: #fff; }
.week-first .day:has(input:checked) b { color: #fff; }

/* 05 — Ночной кампус */
.night {
  --canvas: #1e1e1e;
  --surface: #282b2a;
  --ink: #f6f6f6;
  --muted: #b6c0bf;
  --rule: #424b49;
  --accent: #80cfcd;
  --tint: #253e3c;
  --tint-ink: #d7f4f2;
  color-scheme: dark;
}
.night .pass { grid-template-columns: auto minmax(0, 1fr); border-radius: 4px; }
.night .pass > img { grid-row: 1; grid-column: 1; border-radius: 4px; }
.night .lesson.is-current { padding-inline: 12px; background: var(--surface); border-inline-start: 2px solid var(--accent); }

/* 06 — Пара сейчас */
.current { --qr-size: 76px; }
.current .pass { border-radius: 7px; }
.current .lesson.is-current {
  margin-bottom: 5px;
  padding: 13px 16px;
  border: 0;
  border-radius: 4px 14px 14px 4px;
  background: var(--tint);
  color: var(--tint-ink);
}
.current .is-current h3 { font-size: 19px; }
.current .is-current .lesson-progress { margin-top: 4px; }

/* 07 — Пары в двух колонках */
.split .pass { grid-template-columns: auto minmax(0, 1fr); }
.split .pass > img { grid-row: 1; grid-column: 1; }
.split .lessons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.split .lesson { align-content: start; padding: 10px; border: 1px solid var(--rule); background: var(--surface); }
.split .lesson.is-current { grid-column: 1 / -1; border-top: 2px solid var(--accent); }

/* 08 — Учебный билет */
.ticket .pass { gap: 0; padding: 0; border: 1px dashed var(--accent); border-radius: 12px; }
.ticket .pass-copy { padding: 12px; border-inline-end: 1px dashed var(--rule); }
.ticket .pass > img { margin-inline: 8px; }
.ticket .lesson { grid-template-columns: 78px minmax(0, 1fr); }
.ticket .lesson.is-current .lesson-time { color: var(--accent); }
.ticket .lesson-progress { grid-column: 2; }
.ticket .day { border-radius: 22px; }

/* 09 — Линия дня */
.timeline .pass { border-radius: 4px; border-bottom: 2px solid var(--accent); }
.timeline .lessons { padding-inline-start: 14px; }
.timeline .lesson {
  position: relative;
  padding: 6px 0 12px 14px;
  border: 0;
  border-inline-start: 1px solid var(--rule);
}
.timeline .lesson::before {
  content: "";
  position: absolute;
  inset: 10px auto auto -4px;
  width: 7px;
  height: 7px;
  border: 1px solid var(--accent);
  border-radius: 50%;
  background: var(--canvas);
}
.timeline .lesson.is-current::before { background: var(--accent); }

/* 10 — Пропуск в шапке */
.header-pass { --qr-size: 98px; }
.header-pass .campus-header { background: var(--tint); }

.header-pass .lesson-time { grid-column: 2; grid-row: 1; justify-content: flex-end; text-align: end; }
.header-pass .lesson-detail { grid-column: 1; grid-row: 1; }

@media (max-width: 520px) {
  .studio-layout { order: 0; }

    display: flex;

    padding: 12px;

  }
  .studio-crumb { flex-wrap: wrap; }
}

@media (max-width: 360px) {
  .week { margin-inline: calc(6px - var(--edge)); }
  .week-first .week { margin-inline: 0; padding-inline: 4px; }
}
